name: Verify Polybrutus D49 exact science and Zenodo bibliography
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  exact-d49:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact rational arithmetic
        run: python -m pip install sympy==1.14.0
      - name: Primary exact labelled metric and spectral verification
        run: python src/verify_d49.py
      - name: Independent Fraction-based reconstruction
        run: python tests/independent_d49.py
      - name: Confirm deterministic certificate
        run: git diff --exit-code -- results/certificate_d49.json
      - name: Mandatory current dimension keywords and separate references
        run: python src/check_zenodo_metadata.py
